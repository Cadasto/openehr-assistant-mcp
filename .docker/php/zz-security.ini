; Interim hardening from PHP's advisory for CVE-2026-109618 and CVE-2026-109619
; (https://www.php.net/archive/2026.php). The fix is the patched release, which the Dockerfile
; requires; these settings narrow what a request reaches before the server's code runs, and
; cost this server nothing. Not applied, as the advisory offers them only until the patch is in:
; memory_limit = -1, which would lift the per-request memory cap, and fatal_error_backtraces = 0
; (PHP 8.5 only).

; The server keeps no PHP sessions; upload progress is the confirmed path for CVE-2026-109619.
session.upload_progress.enabled = 0

; MCP requests are small JSON-RPC bodies and nothing is uploaded. These equal the php.ini-production
; defaults, restated so a later overlay cannot raise them unnoticed; Caddy caps bodies at the same size.
post_max_size = 8M
upload_max_filesize = 2M

; Read no per-directory .user.ini, so none can switch the settings above back on.
user_ini.filename =
