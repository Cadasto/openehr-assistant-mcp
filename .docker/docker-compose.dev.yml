services:

  # Node + curl for MCP conformance (npx) and scripts. Use: docker compose run --rm node npx ...
  node:
    image: cadasto/openehr-assistant-mcp-node:latest
    build:
      context: ..
      dockerfile: .docker/Dockerfile
      target: node
    working_dir: /app
    volumes:
      - ../:/app

  app:
    image: cadasto/openehr-assistant-mcp-dev:latest
    build:
      context: ..
      dockerfile: .docker/Dockerfile
      target: development
    tty: true
    # Allow the dev reverse-proxy host so the streamable-http transport's DNS-rebinding
    # protection (SDK >= 0.6) accepts requests proxied via the `ingress` service, and
    # host.docker.internal so clients in other containers (docs/install.md) can connect.
    environment:
      MCP_ALLOWED_HOSTS: "localhost,127.0.0.1,[::1],ingress,app,host.docker.internal,openehr-assistant-mcp.${DOMAIN:-local}"
    volumes:
      - ../:/app
      - composer-cache:/data/.cache/composer

  ingress:
    ports:
      - "8343:8343"
      - "80:80"
      - "443:443"
      - "443:443/udp"

  # MCP Inspector UI (v2) — on-demand (not started by `make up-dev`; see profile).
  #
  # The upstream image, pinned by digest; bump it deliberately. HOST, CLIENT_PORT
  # and DANGEROUSLY_BIND_ALL_INTERFACES are already set in it, so they are not
  # repeated here; the v1 proxy port 6277 no longer exists in v2. The container has
  # no OS keychain, so per-server secrets are kept in memory and die with it.
  #
  # v2 takes its server list from a file. `--config` is a read-only session file
  # (never rewritten, seeded or migrated), so the targets below stay under version
  # control — drop the flag if you would rather add servers ad-hoc in the UI. The
  # Inspector's backend dials the server from inside this container, so the targets
  # use compose-network names; both are in the app's MCP_ALLOWED_HOSTS allow-list.
  inspector:
    image: ghcr.io/modelcontextprotocol/inspector:2.12.0@sha256:37856880200651eab70a8b9ce2649d86beabea5447a8c64a8fe5b407907462fe
    profiles: ["inspector"]
    command: ["--web", "--config", "/config/inspector-servers.json"]
    # The Inspector accepts only loopback by default, twice over: its web server refuses
    # any other `Host` (2.12+), and its API refuses calls (connect, send) from any other
    # browser `Origin` — the server list still loads, as same-origin GETs carry no
    # Origin. Admit the dev vhost so the UI also works at openehr-assistant-mcp.local:6274.
    # ALLOWED_ORIGINS replaces the defaults, so the loopback origins are repeated;
    # MCP_INSPECTOR_ALLOWED_HOSTS adds to them.
    environment:
      ALLOWED_ORIGINS: "http://localhost:6274,http://127.0.0.1:6274,http://[::1]:6274,http://openehr-assistant-mcp.${DOMAIN:-local}:6274"
      MCP_INSPECTOR_ALLOWED_HOSTS: "openehr-assistant-mcp.${DOMAIN:-local}"
      MCP_INSPECTOR_SECRET_STORE: memory
    volumes:
      - ./inspector-servers.json:/config/inspector-servers.json:ro
    ports:
      - "6274:6274"

volumes:
  composer-cache:
